name: Create Release (mainnet-alpha-beta backport)

# Releases from `main` are automated by .github/workflows/release-please.yml.
# This workflow is the manual fallback for cutting a release from the
# long-lived `mainnet-alpha-beta` backport branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch'
        required: true
        type: choice
        options:
          - mainnet-alpha-beta
      version:
        description: 'Release version (e.g., v1.0.0, v2.0.0-beta.1)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Verify version matches .version.json
        run: |
          # Read version from .version.json
          VERSION_FILE="pkg/version/.version.json"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "Error: $VERSION_FILE not found"
            exit 1
          fi

          # Extract version from JSON file
          JSON_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$VERSION_FILE" | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')

          # Remove 'v' prefix from input version if present for comparison
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_VERSION_NO_V="${INPUT_VERSION#v}"

          # Check if versions match (comparing without 'v' prefix)
          if [ "$JSON_VERSION" != "$INPUT_VERSION_NO_V" ]; then
            echo "Error: Version mismatch!"
            echo "  Release version: $INPUT_VERSION_NO_V"
            echo "  .version.json:   $JSON_VERSION"
            echo ""
            echo "Please update $VERSION_FILE to match the release version before creating a release."
            exit 1
          fi

          echo "Version check passed: $JSON_VERSION"

      - name: Create tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          draft: false
          generate_release_notes: true

  # Pushing the tag above triggers:
  #   - .github/workflows/tag-released.yml (multi-arch image + version tag;
  #     :stable is NOT moved because the tag is not reachable from main)
  #   - .github/workflows/buf-publish.yml  (buf module published with the tag)
