# OpenAudio Postgres defaults.
#
# Sized for a validator host with >=6 GB of container-visible RAM.
# Stock Debian Postgres 15 ships shared_buffers=128MB which is far too
# small for a node with a multi-GB database; these values capture the
# bulk of the easy win on a real mainnet workload.
#
# shared_buffers=2GB chosen from paired-cohort measurements on mainnet
# validators carrying ~155 GB databases: 1GB converges at ~72% buffer
# hit ratio, 2GB at ~91%, 4GB at ~99%. 2GB is where the hot small
# indexes fit alongside a slice of the large ones; past 2GB is
# diminishing returns. Operators on tight hosts can dial down via
# OPENAUDIO_PG_SHARED_BUFFERS.
#
# To override any individual setting, set the matching OPENAUDIO_PG_*
# environment variable in your .env (see entrypoint.sh). For full
# control, drop a conf.d/99-*.conf file (later in alpha order wins) or
# use ALTER SYSTEM (postgresql.auto.conf is processed last by Postgres).

shared_buffers = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
effective_cache_size = 3GB
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 512MB
