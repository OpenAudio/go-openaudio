syntax = "proto3";

package storage.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/OpenAudio/go-openaudio/pkg/api/storage/v1";

message PingRequest {}

message PingResponse {
  string message = 1;
}

message GetHealthRequest {}

message GetHealthResponse {}

message UploadFilesRequest {
  string signature = 1;
  string user_wallet = 2;
  string template = 3;
  string preview_start = 4;
  repeated string placement_hosts = 5;
  repeated File files = 6;
}

message File {
  string filename = 1;
  bytes data = 2;
}

message UploadFilesResponse {
  repeated Upload uploads = 1;
}

message GetUploadRequest {
  string id = 1;
  bool fix = 2;
  bool analyze = 3;
}

message GetUploadResponse {
  Upload upload = 1;
}

message StreamTrackRequest {
  StreamTrackSignature signature = 1;
  int64 chunk_size = 2;
}

message StreamTrackResponse {
  bytes data = 1;
}

message StreamTrackSignatureData {
  string track_id = 1;
  int64 timestamp = 2;
}

message StreamTrackSignature {
  // hex encoded signature of the data_hash
  string signature = 1;
  // sha256 hash of the data
  bytes data_hash = 2;
  StreamTrackSignatureData data = 3;
}

message Upload {
  string id = 1;
  string user_wallet = 2;
  string template = 3;
  string orig_filename = 4;
  string orig_file_cid = 5;
  string selected_preview = 6;
  FFProbeResult probe = 7;
  string error = 8;
  int32 error_count = 9;
  repeated string mirrors = 10;
  repeated string transcoded_mirrors = 11;
  string status = 12;
  repeated string placement_hosts = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  string transcoded_by = 17;
  double transcode_progress = 18;
  google.protobuf.Timestamp transcoded_at = 19;
  map<string, string> transcode_results = 20;
  string audio_analysis_status = 21;
  string audio_analysis_error = 22;
  int32 audio_analysis_error_count = 23;
  string audio_analyzed_by = 24;
  google.protobuf.Timestamp audio_analyzed_at = 25;
  AudioAnalysisResult audio_analysis_results = 26;
}

message FFProbeResult {
  message Format {
    string filename = 1;
    string format_name = 2;
    string format_long_name = 3;
    string duration = 4;
    string size = 5;
    string bit_rate = 6;
  }
  Format format = 1;
}

message AudioAnalysisResult {
  double bpm = 1;
  string key = 2;
}

message GetStreamURLRequest {
  string upload_id = 1;
  string cid = 2;
  int64 should_cache = 3;
  int64 track_id = 4;
  int64 user_id = 5;
}

message GetStreamURLResponse {
  repeated string urls = 1;
}

message GetIPDataRequest {
  string ip = 1;
}

message GetIPDataResponse {
  string country = 1;
  string country_code = 2;
  string city = 3;
  string region = 4;
  string region_code = 5;
  float latitude = 6;
  float longitude = 7;
}

message GetRendezvousNodesRequest {
  string cid = 1;
  int32 replication_factor = 2; // Optional, defaults to 4 if not specified
}

message GetRendezvousNodesResponse {
  repeated string nodes = 1; // List of node endpoints in rendezvous order
}

message GetStatusRequest {}

message GetStatusResponse {
  int64 storage_expectation = 1;
}

message GetStorageDiagnosticsRequest {}

message GetStorageDiagnosticsResponse {
  string self_host = 1;
  int64 disk_used_bytes = 2;
  int64 disk_total_bytes = 3;
  int64 storage_expectation_bytes = 4;
  bool disk_has_space = 5;
  int32 replication_factor = 6;
  int64 uploads_count = 7;
  string blob_store_prefix = 8;

  RepairRun last_successful_repair = 9;
  RepairRun last_successful_cleanup = 10;
  RepairRun in_progress_repair = 11;
  repeated RepairRun recent_repair_runs = 12;

  repeated PeerStatus peers = 13;
  repeated DailyServedCount served_counts = 14;

  ReadRepairStats read_repair = 15;
  PoSStats pos = 16;
  BandwidthStats bandwidth = 17;
  repeated PoSChallenge recent_pos_challenges = 18;
  repeated ServedEvent recent_served = 19;

  // Archive bucket (set when OPENAUDIO_ARCHIVE_STORAGE_DRIVER_URL is configured).
  // When archive_configured=false, the remaining archive fields are zero.
  bool archive_configured = 20;
  int64 archive_disk_used_bytes = 21;
  int64 archive_disk_total_bytes = 22;
  string archive_blob_store_prefix = 23;

  // Per-bucket headroom; disk_has_space (#5) stays as the AND aggregate.
  bool primary_disk_has_space = 24;
  bool archive_disk_has_space = 25;

  // Whether this storage node is running with OPENAUDIO_STORE_ALL/STORE_ALL enabled.
  bool store_all = 26;

  WaveformStatus waveforms = 27;
}

// WaveformStatus reports the state of precomputed waveform analysis: whether it
// is switched on, what the current backfill pass has done, and how the stored
// population breaks down.
message WaveformStatus {
  // The three switches nest: backfill does nothing without enabled, and
  // archive does nothing without backfill. Reporting all three is what
  // distinguishes "off" from "on but not walking history".
  bool enabled = 1;
  bool backfill_enabled = 2;
  bool archive_enabled = 3;

  // version is a fingerprint of the algorithm version and the parameters that
  // change the output, so it is opaque alone -- the following three fields are
  // what make it readable. A row at a different version is recomputed.
  int32 version = 4;
  int32 algorithm_version = 5;
  int32 buckets = 6;
  int32 sample_rate = 7;

  // Row counts by status: done, not_local, unavailable, error, archive_skipped.
  map<string, int64> by_status = 8;
  // Completed rows computed under different settings, i.e. the size of the
  // re-backfill the current version implies.
  int64 stale_version = 9;

  WaveformRun run = 10;
}

// WaveformRun is one pass of the backfill walk. The walk descends through
// upload created_at, so a pass has a start, a position, and an end.
message WaveformRun {
  google.protobuf.Timestamp started_at = 1;
  // Last checkpoint. On a long pass this is what separates "working" from
  // "wedged"; started_at can be hours old while nothing is happening.
  google.protobuf.Timestamp updated_at = 2;
  // Position of the walk. Absent before the first batch of a pass.
  google.protobuf.Timestamp cursor_created_at = 3;
  // Set once the walk has reached the end of history. It restarts after an
  // interval, since uploads replicate in with older timestamps than the walk
  // has already passed.
  bool exhausted = 4;

  // Queued for analysis and skipped as archive-tier during this pass.
  int64 queued = 5;
  int64 archive_skipped = 6;

  // Fraction of the upload history walked, 0..1, estimated from where the
  // cursor sits between the oldest and newest audio upload. Uploads are not
  // spread evenly across that span, so this and remaining_ns are an order of
  // magnitude rather than a deadline -- counting the rows left would mean a
  // scan on every render.
  double fraction = 7;
  int64 elapsed_ns = 8;
  // Zero when there is not yet enough progress to project from.
  int64 remaining_ns = 9;

  // The version this pass is walking under. Differing from WaveformStatus
  // version means a re-backfill is due but has not been picked up yet.
  int32 version = 10;
}

message ReadRepairStats {
  int64 local_hits = 1;
  int64 misses = 2;
  int64 pull_attempts = 3;
  int64 pull_successes = 4;
  int64 proxied = 5;
  int64 redirected = 6;
}

message PoSStats {
  int64 attempted = 1;
  int64 passed = 2;
  int64 failed = 3;
}

message BandwidthStats {
  int64 ingress_bytes = 1;
  int64 egress_bytes = 2;
  google.protobuf.Timestamp since = 3;
}

message PoSChallenge {
  google.protobuf.Timestamp at = 1;
  string cid = 2;
  bool ok = 3;
  string error = 4;
}

message ServedEvent {
  google.protobuf.Timestamp at = 1;
  string cid = 2;
  string action = 3;
}

message RepairRun {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp finished_at = 2;
  bool cleanup_mode = 3;
  int64 content_size_bytes = 4;
  int64 duration_ns = 5;
  string aborted_reason = 6;
  int32 cursor_i = 7;
  map<string, int64> counters = 8;
  // Sum of successful pull + delete actions in this run (pull_mine_success +
  // delete_invalid_success + delete_resized_image_ok + delete_over_replicated_success).
  int64 files_changed = 9;
  // Last time the run checkpointed its cursors and counters. For a run still in
  // progress this is the only field that distinguishes "working" from "wedged":
  // started_at can be months old on a long resume.
  google.protobuf.Timestamp updated_at = 10;
}

message PeerStatus {
  string host = 1;
  google.protobuf.Timestamp last_reachable = 2;
  google.protobuf.Timestamp last_healthy = 3;
  int32 reachable_peer_count = 4;
}

message DailyServedCount {
  google.protobuf.Timestamp day = 1;
  string action = 2;
  int64 count = 3;
}
